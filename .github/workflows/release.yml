name: Release

on:
  push:
    tags: ["v*"]
  # Ejecución manual: genera el instalador como artefacto sin publicar un release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Un tag v0.4.0 con la app en 0.3.0 publicaría un instalador mal numerado.
      - name: Version matches the tag
        run: python scripts/check_versions.py

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Empaqueta CPython 3.12 portable + backend + wheel de basicsr y ejecuta tauri build.
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      # Instala, arranca el backend empaquetado, comprueba que responde y desinstala.
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/smoke_test_installer.ps1 -Installer $installer.FullName

      - name: Checksums
        shell: pwsh
        run: |
          $bundle = "frontend/src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$bundle/*.exe" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii "$bundle/SHA256SUMS.txt"
          Get-Content "$bundle/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: oroya-video-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      # Notas escritas a mano si existe docs/releases/<tag>.md; si no, solo las automáticas.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then echo "path=$notes" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
