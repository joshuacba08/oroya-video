name: Release

on:
  push:
    tags: ["v*"]
  # Ejecución manual: genera el instalador como artefacto sin publicar un release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Empaqueta CPython 3.12 portable + backend + wheel de basicsr y ejecuta tauri build.
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: oroya-video-windows-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
