name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    # La app se distribuye para Windows: rutas, procesos y os.startfile se prueban ahí.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: runtime empaquetado en el instalador. 3.14: entorno de desarrollo.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # 3.12 = runtime del instalador: se prueba con las versiones exactas que empaqueta.
      - name: Install locked runtime dependencies (installer Python)
        if: matrix.python == '3.12'
        run: python -m pip install --require-hashes -r requirements-core.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: |
          python -m ruff check app tests ../scripts
          python -m ruff format --check app tests ../scripts
      - name: Tests
        run: python -m pytest -q

  versions:
    name: Same version everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py

  desktop:
    name: Desktop shell (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      # generate_context! incrusta el frontend compilado: basta un placeholder para compilar.
      - name: Placeholder frontend dist
        shell: bash
        run: |
          mkdir -p ../dist/frontend/browser
          echo '<!doctype html><title>ci</title>' > ../dist/frontend/browser/index.html
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Dependency audit (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python (installer lock)
        run: |
          python -m pip install pip-audit
          pip-audit --require-hashes --disable-pip -r backend/requirements-core.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Frontend (production dependencies)
        working-directory: frontend
        run: pnpm audit --prod

  api-contract:
    name: API contract up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Regenerate shared/api/openapi.json
        run: python scripts/export_openapi.py
      - name: Fail if the committed contract is stale
        run: git diff --exit-code -- shared/api/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API types up to date
        run: |
          pnpm typegen
          git diff --exit-code -- src/app/core/api/oroya-api.types.ts
      - name: Tests
        run: pnpm test --watch=false
      - name: Build
        run: pnpm build
