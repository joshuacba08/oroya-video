name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    # La app se distribuye para Windows: rutas, procesos y os.startfile se prueban ahí.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: runtime empaquetado en el instalador. 3.14: entorno de desarrollo.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: |
          python -m ruff check app tests ../scripts
          python -m ruff format --check app tests ../scripts
      - name: Tests
        run: python -m pytest -q

  api-contract:
    name: API contract up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Regenerate shared/api/openapi.json
        run: python scripts/export_openapi.py
      - name: Fail if the committed contract is stale
        run: git diff --exit-code -- shared/api/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API types up to date
        run: |
          pnpm typegen
          git diff --exit-code -- src/app/core/api/oroya-api.types.ts
      - name: Tests
        run: pnpm test --watch=false
      - name: Build
        run: pnpm build
