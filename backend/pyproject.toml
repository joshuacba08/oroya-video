[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oroya-video-backend"
version = "0.5.3"
description = "Local FastAPI backend foundation for Oroya Video."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "psutil",
    "sqlalchemy",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchvision",
    "numpy",
    "Pillow",
    "opencv-python",
    "realesrgan",
    "basicsr",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["storage*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Código de terceros incluido tal cual (MIT, ver THIRD_PARTY_NOTICES.md).
extend-exclude = ["app/enhancers/rife/IFNet_HDv3_v4_25.py", "app/enhancers/rife/warplayer.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
