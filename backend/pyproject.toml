[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oroya-video-backend"
version = "0.1.0"
description = "Local FastAPI backend foundation for Oroya Video."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "psutil",
    "sqlalchemy",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchvision",
    "numpy",
    "Pillow",
    "opencv-python",
    "realesrgan",
    "basicsr",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
